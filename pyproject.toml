[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toddc"
version = "0.1.0"
description = "Task-Oriented Dialogue Discourse Coherence — controlled coherence-violation injection over SGD via a chain-of-passes pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code) / CC BY-SA 4.0 (data)" }
keywords = ["discourse-coherence", "task-oriented-dialogue", "sgd", "evaluation", "llm"]

dependencies = [
    "datasets>=2.18",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
closed = ["anthropic>=0.40", "openai>=1.30"]
open = ["transformers>=4.40", "torch>=2.2"]
eval = ["numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
toddc = "toddc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
